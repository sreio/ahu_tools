name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows AMD64
            platform: windows/amd64
            os: windows-latest
            artifact-name: AhuTools-windows-amd64.exe
          - name: macOS AMD64
            platform: darwin/amd64
            os: macos-latest
            artifact-name: AhuTools-darwin-amd64.dmg
          - name: macOS ARM64
            platform: darwin/arm64
            os: macos-latest
            artifact-name: AhuTools-darwin-arm64.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis -y

      - name: Install create-dmg
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          wails build -platform ${{ matrix.platform }} -nsis
          $installer = Get-ChildItem -Path build/bin -Recurse -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer not found" }
          Copy-Item $installer.FullName "${{ matrix.artifact-name }}"

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          wails build -platform ${{ matrix.platform }}
          APP_PATH=$(find build/bin -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "macOS app bundle not found"
            exit 1
          fi
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          create-dmg \
            --volname "AhuTools" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            "${{ matrix.artifact-name }}" \
            "$APP_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display artifacts
        run: ls -laR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
